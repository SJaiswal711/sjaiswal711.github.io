  youtube          :

  zhihu            :


# =========================================================
# PUBLICATION CATEGORIES
# =========================================================

publication_category:

  books:
    title: "Books"

  manuscripts:
    title: "Journal Articles"

  conferences:
    title: "Conference Papers"


# =========================================================
# SITE SETTINGS
# =========================================================

teaser                   :
breadcrumbs              : false

words_per_minute         : 160

future                   : true

read_more                : "disabled"

talkmap_link             : false


# =========================================================
# COMMENTS
# =========================================================

comments:

  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :


# =========================================================
# STATICMAN
# =========================================================

staticman:

  allowedFields          : ['name', 'email', 'url', 'message']

  branch                 : "gh-pages"

  commitMessage          : "New comment."

  filename               : comment-{@timestamp}

  format                 : "yml"

  moderation             : true

  path                   : "_data/comments/{options.slug}"

  requiredFields        : ['name', 'email', 'message']

  transforms:
    email:
      : "md5"

  generatedFields:

    date:
      type               : "date"

      options:
        format           : "iso8601"


# =========================================================
# ATOM FEED
# =========================================================

atom_feed:

  hide                   : false

  path                   :


# =========================================================
# SEO / SEARCH ENGINE VERIFICATION
# =========================================================

google_site_verification :

bing_site_verification   :

alexa_site_verification  :

yandex_site_verification :


# =========================================================
# SOCIAL SHARING / PERSON IDENTITY
# =========================================================

twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 : "/images/profile.png"

og_description           : "Shambhavi Jaiswal — Cosmology and Astrophysics | Early-Universe cosmology | Cosmological probes | Bayesian inference | Scientific computing"


# Structured social profiles
social:

  type                   : "Person"

  name                   : "Shambhavi Jaiswal"

  links:

    - "https://sjaiswal711.github.io/"
    - "https://github.com/SJaiswal711"
    - "https://www.linkedin.com/in/shambhavi-jaiswal-52a29123a"
    - "https://scholar.google.com/citations?user=tVmVtiIAAAAJ"
    - "https://orcid.org/0009-0007-0298-5455"


# =========================================================
# ANALYTICS
# =========================================================

analytics:

  provider               : false

  google:
    tracking_id          : ""


# =========================================================
# READING FILES
# =========================================================

include:

  - .htaccess
  - _pages
  - files


exclude:

  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache

  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor

  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor


keep_files:

  - .git
  - .svn


encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# =========================================================
# CONVERSION
# =========================================================

markdown: kramdown

highlighter: rouge

lsi: false

excerpt_separator: "\n\n"

incremental: false


# =========================================================
# MARKDOWN PROCESSING
# =========================================================

kramdown:

  input: GFM

  hard_wrap: false

  auto_ids: true

  footnote_nr: 1

  entity_output: as_char

  toc_levels: 1..6

  smart_quotes: lsquo,rsquo,ldquo,rdquo

  enable_coderay: false


# =========================================================
# COLLECTIONS
# =========================================================

collections:

  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# =========================================================
# DEFAULTS
# =========================================================

defaults:

  # -------------------------------------------------------
  # Posts
  # -------------------------------------------------------

  - scope:
      path: ""
      type: posts

    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true


  # -------------------------------------------------------
  # Pages
  # -------------------------------------------------------

  - scope:
      path: ""
      type: pages

    values:
      layout: single
      author_profile: true


  # -------------------------------------------------------
  # Teaching
  # -------------------------------------------------------

  - scope:
      path: ""
      type: teaching

    values:
      layout: single
      author_profile: true
      share: true
      comments: true


  # -------------------------------------------------------
  # Publications
  # -------------------------------------------------------

  - scope:
      path: ""
      type: publications

    values:
      layout: single
      author_profile: true
      share: true
      comments: true


  # -------------------------------------------------------
  # Portfolio / Research
  # -------------------------------------------------------

  - scope:
      path: ""
      type: portfolio

    values:
      layout: single
      author_profile: true
      share: true
      comment: true


  # -------------------------------------------------------
  # Talks
  # -------------------------------------------------------

  - scope:
      path: ""
      type: talks

    values:
      layout: talk
      author_profile: true
      share: true


# =========================================================
# SASS / SCSS
# =========================================================

sass:

  sass_dir: _sass

  style: compressed


# =========================================================
# OUTPUT
# =========================================================

permalink: /:categories/:title/

timezone: Etc/UTC


# =========================================================
# PLUGINS
# =========================================================

plugins:

  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# =========================================================
# GITHUB PAGES WHITELIST
# =========================================================

whitelist:

  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# =========================================================
# ARCHIVES
# =========================================================

category_archive:

  type: liquid

  path: /categories/


tag_archive:

  type: liquid

  path: /tags/


# =========================================================
# HTML COMPRESSION
# =========================================================

compress_html:

  clippings: all

  ignore:
    envs: development
