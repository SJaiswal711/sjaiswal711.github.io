# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.
# Values here are generally set once and changed only occasionally.

# =========================================================
# BASIC SITE SETTINGS
# =========================================================

locale                   : "en-US"
site_theme               : "default"

title                    : "Shambhavi Jaiswal"
title_separator          : "|"

name                     : &name "Shambhavi Jaiswal"

description              : &description "Cosmology and astrophysics | Early-Universe cosmology | Cosmological probes | Bayesian inference | Scientific computing"

url                      : "https://sjaiswal711.github.io"
baseurl                  : ""

repository               : "SJaiswal711/sjaiswal711.github.io"


# =========================================================
# SITE AUTHOR
# =========================================================

author:

  # -------------------------------------------------------
  # Biographical information
  # -------------------------------------------------------

  avatar           : "profile.png"

  name             : "Shambhavi Jaiswal"

  description      : "Cosmology and astrophysics"

  pronouns         : "she/her"

  bio              : "Interested in cosmology, astrophysics, early-Universe cosmology, cosmological probes, Bayesian inference, and computational methods."

  location         : "India"

  employer         :

  uri              : "https://sjaiswal711.github.io"

  email            : "sjaiswal0711@gmail.com"


  # -------------------------------------------------------
  # Academic profiles
  # -------------------------------------------------------

  academia         :

  arxiv            : "SJaiswal"

  googlescholar    : "tVmVtiIAAAAJ"

  inspire-hep      :

  impactstory      :

  orcid            : "0009-0007-0298-5455"

  semantic         :

  ssrn             :

  pubmed           :

  researchgate     :

  scopus           :

  zotero           :


  # -------------------------------------------------------
  # Repositories / Software
  # -------------------------------------------------------

  bitbucket        :

  codepen          :

  dribbble         :

  github           : "sjaiswal711"

  kaggle           :

  stackoverflow    :


  # -------------------------------------------------------
  # Social / Professional
  # -------------------------------------------------------

  artstation       :

  bluesky          :

  facebook         :

  flickr           :

  foursquare       :

  goodreads        :

  google_plus      :

  instagram        :

  lastfm           :

